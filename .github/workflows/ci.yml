name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore RagSystem.sln

      - name: Build
        run: dotnet build RagSystem.sln --no-restore -c Release

      - name: Unit + API tests
        run: dotnet test RagSystem.sln --no-build -c Release --filter "Category!=Integration"

      - name: Integration tests (Testcontainers + pgvector)
        run: dotnet test tests/Rag.IntegrationTests --no-build -c Release
